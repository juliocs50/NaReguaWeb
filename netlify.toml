# Mesmo Firebase que o Android: projeto naregua-61564
# (proxy /api opcional — o site também usa api-config.js com a URL direta da Function)

[build]
  publish = "public"

[[redirects]]
  from = "/api"
  to = "https://southamerica-east1-naregua-61564.cloudfunctions.net/naReguaWebApi"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://southamerica-east1-naregua-61564.cloudfunctions.net/naReguaWebApi"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
