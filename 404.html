<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barb x Go</title>
    <script>
      // GitHub Pages não suporta rewrite para SPA/rotas.
      // Usamos 404.html para redirecionar /<slug> para /?p=<slug>,
      // onde o app lê o parâmetro e carrega o agendamento.
      (function () {
        try {
          var path = window.location.pathname || "/";
          var parts = path.split("/").filter(Boolean);
          if (!parts.length) {
            window.location.replace("./");
            return;
          }

          // Não interceptar páginas reais
          var first = parts[0];
          if (
            first === "public" ||
            first === "about" ||
            first === "privacy" ||
            (first && first.toLowerCase() === "deleteaccount") ||
            first === "index.html"
          ) {
            window.location.replace("./");
            return;
          }

          var slug = decodeURIComponent(first);
          window.location.replace("./?p=" + encodeURIComponent(slug));
        } catch (_e) {
          window.location.href = "./";
        }
      })();
    </script>
  </head>
  <body>
    A redirecionar…
  </body>
</html>
