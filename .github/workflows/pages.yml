# GitHub Pages: publica o conteúdo de public/ (site estático).
# No repositório: Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CNAME para domínio custom (se existir na raiz)
        run: |
          if [ -f CNAME ]; then cp CNAME public/CNAME; fi

      # GitHub Pages não reescreve /slug → index.html; sem isto aparece "File not found".
      - name: SPA fallback (404.html = index.html)
        run: cp public/index.html public/404.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
